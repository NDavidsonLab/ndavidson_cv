name: Build LaTeX CV

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    env:
      TEX_FILE: cv.tex

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build document
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error "$TEX_FILE"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: "*.pdf"

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: dist

      - name: Create release tag for manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RELEASE_TAG=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Set release tag for tag pushes
        if: github.event_name != 'workflow_dispatch'
        run: |
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Publish PDF to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: LaTeX Build ${{ env.RELEASE_TAG }}
          files: |
            dist/*.pdf
